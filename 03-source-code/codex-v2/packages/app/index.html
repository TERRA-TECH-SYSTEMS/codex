<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="CodeEX — Sovereign IDE by TerraTech Systems" />
  <title>CodeEX</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    /* Critical CSS — prevents flash of unstyled content */
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #000; color: #f5f5f7; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #codex-boot-error { display: none; position: fixed; inset: 0; z-index: 99999; background: #000; color: #ff453a; font-family: monospace; font-size: 14px; padding: 40px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="codex-boot-error"></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('codex-boot-error');
      if (el) { el.style.display = 'block'; el.textContent = 'CodeEX Boot Error:\n\n' + msg + '\n\nSource: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : ''); }
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('codex-boot-error');
      if (el) { el.style.display = 'block'; el.textContent = 'CodeEX Boot Error (Promise):\n\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason); }
    });
  </script>
  <script src="/src/index.tsx" type="module"></script>
</body>
</html>
