appId: ai.terratech.codex
productName: CodeEX
copyright: Copyright © 2026 TerraTech Systems. All rights reserved.
electronDist: ../../node_modules/electron/dist
electronVersion: 39.7.0
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/build/Release/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/icons/WindowIcon/512-512.png
  - resources/CodeEXSplash.svg
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins

win:
  icon: resources/icons/WindowsLauncherIcons/CodeEX.ico
  target:
    - nsis
  publish:
    provider: generic
    url: "https://github.com/TERRA-TECH-SYSTEMS/codex/releases/download/v${version}"
    useMultipleRangeRequest: false
mac:
  icon: resources/icons/MacLauncherIcons/icon.icns
  category: public.app-category.developer-tools
  protocols:
    - name: codex
      schemes:
        - codex
  darkModeSupport: true
  target:
    - dmg
    - zip
  publish:
    provider: generic
    url: "https://github.com/TERRA-TECH-SYSTEMS/codex/releases/download/v${version}"
linux:
  icon: resources/icons/LinuxLauncherIcons
  category: Development
  mimeTypes:
    - inode/directory
  vendor: TerraTech Systems
  target:
    - deb
    - AppImage
  publish:
    provider: generic
    url: "https://github.com/TERRA-TECH-SYSTEMS/codex/releases/download/v${version}"

nsis:
  menuCategory: true
  oneClick: false
  perMachine: false
  installerHeaderIcon: resources/icons/WindowsLauncherIcons/CodeEX.ico
  installerIcon: resources/icons/WindowsLauncherIcons/CodeEX.ico
  uninstallerIcon: resources/icons/WindowsLauncherIcons/CodeEX.ico
  installerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  uninstallerSidebar: resources/icons/InstallerSidebarImage/164-314Windows.bmp
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: ${productName}Setup.${ext}
  license: LICENSE
dmg:
  artifactName: ${productName}.${ext}
deb:
  artifactName: ${productName}.${ext}
appImage:
  artifactName: ${productName}.${ext}

afterPack: ./scripts/after-pack.js
