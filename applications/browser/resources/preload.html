<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: #0a0a0a;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0a0a0a !important;
            background-image: none;
            z-index: 99999;
        }

        .theia-preload::after {
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .codex-logo {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #ffffff;
            animation: codex-pulse 2s ease infinite;
        }

        .codex-logo span {
            color: #2997ff;
        }

        .codex-loader {
            width: 160px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            margin-top: 24px;
            overflow: hidden;
        }

        .codex-loader-bar {
            height: 100%;
            width: 40%;
            background: #2997ff;
            border-radius: 1px;
            animation: codex-loading 1.5s ease-in-out infinite;
        }

        @keyframes codex-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes codex-loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
    </style>
</head>

<body>
    <div class='spinner-container'>
        <div class='codex-logo'>Code<span>EX</span></div>
        <div class='codex-loader'><div class='codex-loader-bar'></div></div>
    </div>

    <script>
        if (document.head) {
            let link = document.createElement('link');
            link.rel = 'icon';
            link.href = '/favicon.ico';
            document.head.appendChild(link);
        }
    </script>
</body>

</html>
