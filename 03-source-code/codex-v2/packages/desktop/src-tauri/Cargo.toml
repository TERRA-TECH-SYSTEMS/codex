[package]
name = "codeex-desktop"
version = "0.1.0"
description = "CodeEX v2 Desktop Runtime"
authors = ["TerraTech Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "7"
portable-pty = "0.9"
walkdir = "2"
regex = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
