name: Build and Release CodeEX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  PRODUCT_NAME: "CodeEX - Ageixtic IDE"
  APP_NAME: "CodeEX"

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout CodeEX
        uses: actions/checkout@v4

      - name: Checkout VSCodium
        uses: actions/checkout@v4
        with:
          repository: VSCodium/vscodium
          path: vscodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CodeEX
        env:
          VSCODE_ARCH: arm64
          OS_NAME: osx
          SHOULD_BUILD: yes
        run: |
          cd vscodium
          ./get_repo.sh
          ./build.sh

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Sign Application
        env:
          CERT_NAME: "Developer ID Application: TERRA TECH SYSTEMS (V2F8RR8GSR)"
        run: |
          APP_PATH="vscodium/VSCode-darwin-arm64/${APP_NAME}.app"

          # Sign all nested binaries
          find "$APP_PATH" \( -name "*.node" -o -name "*.dylib" \) -type f | while read file; do
            codesign --force --options runtime --timestamp --sign "$CERT_NAME" "$file"
          done

          # Sign executables
          for binary in rg codex-tunnel spawn-helper ShipIt; do
            find "$APP_PATH" -name "$binary" -type f | while read file; do
              codesign --force --options runtime --timestamp --sign "$CERT_NAME" "$file"
            done
          done

          # Sign frameworks and helpers
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$fw"
          done

          find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d | while read helper; do
            codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$helper"
          done

          # Sign main app
          codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_TEMP="/tmp/codex-dmg"
          mkdir -p "$DMG_TEMP"
          cp -R "vscodium/VSCode-darwin-arm64/${APP_NAME}.app" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"

          hdiutil create -volname "$PRODUCT_NAME" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-arm64.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-arm64.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-arm64.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeEX-macos-arm64
          path: CodeEX-Ageixtic-IDE-*-arm64.dmg

  build-macos-x64:
    runs-on: macos-15
    steps:
      - name: Checkout CodeEX
        uses: actions/checkout@v4

      - name: Checkout VSCodium
        uses: actions/checkout@v4
        with:
          repository: VSCodium/vscodium
          path: vscodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CodeEX
        env:
          VSCODE_ARCH: x64
          OS_NAME: osx
          SHOULD_BUILD: yes
        run: |
          cd vscodium
          ./get_repo.sh
          ./build.sh

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Sign Application
        env:
          CERT_NAME: "Developer ID Application: TERRA TECH SYSTEMS (V2F8RR8GSR)"
        run: |
          APP_PATH="vscodium/VSCode-darwin-x64/${APP_NAME}.app"

          find "$APP_PATH" \( -name "*.node" -o -name "*.dylib" \) -type f | while read file; do
            codesign --force --options runtime --timestamp --sign "$CERT_NAME" "$file"
          done

          for binary in rg codex-tunnel spawn-helper ShipIt; do
            find "$APP_PATH" -name "$binary" -type f | while read file; do
              codesign --force --options runtime --timestamp --sign "$CERT_NAME" "$file"
            done
          done

          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$fw"
          done

          find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d | while read helper; do
            codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$helper"
          done

          codesign --force --deep --options runtime --timestamp --sign "$CERT_NAME" "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_TEMP="/tmp/codex-dmg"
          mkdir -p "$DMG_TEMP"
          cp -R "vscodium/VSCode-darwin-x64/${APP_NAME}.app" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"

          hdiutil create -volname "$PRODUCT_NAME" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-x64.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-x64.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-x64.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeEX-macos-x64
          path: CodeEX-Ageixtic-IDE-*-x64.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout CodeEX
        uses: actions/checkout@v4

      - name: Checkout VSCodium
        uses: actions/checkout@v4
        with:
          repository: VSCodium/vscodium
          path: vscodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CodeEX
        env:
          VSCODE_ARCH: x64
          OS_NAME: windows
          SHOULD_BUILD: yes
        shell: bash
        run: |
          cd vscodium
          ./get_repo.sh
          ./build.sh

      - name: Create Installer
        shell: pwsh
        run: |
          # Package as zip for now (NSIS installer can be added later)
          Compress-Archive -Path "vscodium/VSCode-win32-x64/*" -DestinationPath "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-win-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeEX-windows-x64
          path: CodeEX-Ageixtic-IDE-*-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeEX
        uses: actions/checkout@v4

      - name: Checkout VSCodium
        uses: actions/checkout@v4
        with:
          repository: VSCodium/vscodium
          path: vscodium

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CodeEX
        env:
          VSCODE_ARCH: x64
          OS_NAME: linux
          SHOULD_BUILD: yes
        run: |
          cd vscodium
          ./get_repo.sh
          ./build.sh

      - name: Create tar.gz
        run: |
          tar -czvf "CodeEX-Ageixtic-IDE-${{ github.event.inputs.version || github.ref_name }}-linux-x64.tar.gz" \
            -C vscodium "VSCode-linux-x64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeEX-linux-x64
          path: CodeEX-Ageixtic-IDE-*-linux-x64.tar.gz

  create-release:
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: CodeEX ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            CodeEX-macos-arm64/*
            CodeEX-macos-x64/*
            CodeEX-windows-x64/*
            CodeEX-linux-x64/*
          body: |
            ## CodeEX - Ageixtic IDE ${{ github.ref_name }}

            ### Downloads
            - **macOS Apple Silicon**: CodeEX-Ageixtic-IDE-${{ github.ref_name }}-arm64.dmg
            - **macOS Intel**: CodeEX-Ageixtic-IDE-${{ github.ref_name }}-x64.dmg
            - **Windows x64**: CodeEX-Ageixtic-IDE-${{ github.ref_name }}-win-x64.zip
            - **Linux x64**: CodeEX-Ageixtic-IDE-${{ github.ref_name }}-linux-x64.tar.gz

            ### Included Extensions
            - Ageixtic Core - Ollama AI integration
            - Quota Manager - Token usage tracking
            - Session Protector - Workspace state preservation

            ### Verification
            macOS builds are signed with Developer ID and notarized by Apple.
# Workflow trigger
